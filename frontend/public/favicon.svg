  <!-- AOIN mark. Square viewBox with the artwork centred: the source icon is
       500x425, so a browser drawing it into a square tab slot would letterbox
       it and shrink the mark. The offsets centre a 494x420 drawing in 500x500.

       The fill follows the BROWSER's colour scheme, not the site's. The mark is
       cool white on black everywhere else, which is all but invisible against a
       light tab strip, so it inverts to near black there. Keep both rules: one
       hard-coded fill is wrong in one mode or the other. -->
