name = "aoin-46009-fallback"
main = "worker.js"
compatibility_date = "2026-08-01"

routes = [
  { pattern = "46009.someofitlater.com/*", zone_name = "someofitlater.com" },
  { pattern = "allofitnow.com/*", zone_name = "allofitnow.com" },
  { pattern = "www.allofitnow.com/*", zone_name = "allofitnow.com" },
]

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "46009"

# v3m (#111/#112): rate-limit counters + MX negative cache for /api/contact
[[kv_namespaces]]
binding = "CONTACT_KV"
id = "57dd736e7e23469d9dbc68165e9cf986"
