version: 1
# Machine SSOT for the 25 tracking points. Human-readable snapshot + provenance:
# Zaraz spec wiki page (M1 Dictionary). Changes are HITL-gated (Tier 3).
# variance: structural = fixed count, drift escalates; content = count moves with
# designer curation, only 0-count (MISSING) escalates.
rows:
